components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    InventionId:
      name: inventionId
      in: path
      required: true
      schema:
        type: string
    SpinOutId:
      name: spinOutId
      in: path
      required: true
      schema:
        type: string
    ResearcherId:
      name: researcherId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ResponseMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
          format: double
        currency:
          type: string
          example: MXN
    DisclosureState:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [publishable, aggregate_only, confidential, internal_only]
        reason:
          type: string
          enum:
            - not_restricted
            - unfiled_invention
            - commercial_terms
            - personal_data
            - prejudicial_to_filing
    PipelineStage:
      type: string
      description: Stations on the route from pure research to market
      enum: [research, invention, prototype, in_market]
    SubjectMatterType:
      type: string
      enum:
        - software_only
        - software_in_physical_product
        - hardware
        - dataset
        - process
        - model_weights
    ProtectionRouteType:
      type: string
      enum:
        - patent
        - author_rights_software
        - trade_secret
        - none_available
    Discipline:
      type: string
      enum:
        - artificial_intelligence
        - computer_science
        - data_and_information_sciences
        - electronics
        - telecommunications
        - mathematics
        - other
