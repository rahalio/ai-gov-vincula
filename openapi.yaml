      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProtectionRoutingCreate"
      responses:
        "201":
          description: Route determined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeProtectionRouting"
        "409":
          description: >-
            Route unavailable for this subject matter, for example a patent route
            requested for software with no physical embodiment; alternative offered
          content:
            application/json:
              schema:
