      type: string
      description: Programme maturity ladder used in the source assessment
      enum: [recently_formed, being_formed, consolidated, international_standard]
    AdministrationHorizon:
      type: string
      enum:
        - current_administration
        - transition_phase
        - new_administration
        - beyond_administrations
    RiskGrade:
      type: string
      enum: [proven_low_risk, incremental, novel, high_risk_high_reward]
