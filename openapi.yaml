            enum: [awaiting_routing, routed, filed, granted, unprotectable, abandoned]
        - name: subjectMatter
          in: query
          schema:
            $ref: "#/components/schemas/SubjectMatterType"
      responses:
        "200":
          description: Inventions page
          content:
            application/json:
              schema:
