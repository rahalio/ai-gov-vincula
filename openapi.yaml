    post:
      operationId: registerSpinOut
      tags: [Equity]
      summary: Register a university spin-out arising from a project
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpinOutCreate"
      responses:
