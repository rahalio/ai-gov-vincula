openapi: 3.0.3
info:
  title: Vincula
  version: 0.1.0
  description: >-
    Research-to-commercialisation and talent pipeline ledger for publicly funded AI.
    Projects advance through research, invention, prototype and in-market stages only
    against stage evidence. Inventions must resolve to a protection route, and software
    subject matter is refused a patent route and offered author's rights instead.
    Portfolio cohorts declare conversion ratios, spin-out equity is held as a portfolio
    position, researcher classification mismatches are counted, and every commitment
    carries an administration horizon with an explicit re-adoption decision.
  x-product-slug: ai-gov-vincula
  x-source: ai-in-gov/Towards-an-ai-strategy-in-Mexico/
servers:
  - url: https://api.example.com
tags:
  - name: Pipeline
    description: Projects and stage-gated advancement from research to market
  - name: Awards
    description: Funding awards, risk grading, and sector council priorities
  - name: Protection
    description: Invention disclosure, protection routing, and filings
  - name: Validation
    description: Prototypes, commercial validation, sandboxes, and running services
  - name: Equity
    description: Spin-outs, state equity positions, and recycled proceeds
  - name: Researchers
    description: Researcher classification, joint appointments, and workload
  - name: Talent
    description: Postgraduate programmes, cohorts, scholarships, and destinations
  - name: Regional
    description: State attribution and geographic concentration
  - name: Continuity
    description: Administration horizons, handover packs, and re-adoption
  - name: Reporting
    description: Portfolio report and reform evidence registers
paths:
  /v1/projects:
    get:
      operationId: listPipelineProjects
      tags: [Pipeline]
      summary: List projects with their current pipeline stage
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: stage
          in: query
          schema:
            $ref: "#/components/schemas/PipelineStage"
        - name: stateCode
          in: query
          schema:
            type: string
        - name: cohortId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Projects page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopePipelineProject"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: registerPipelineProject
      tags: [Pipeline]
      summary: Register a publicly funded AI project at its current stage
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipelineProjectCreate"
      responses:
        "201":
          description: Project registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePipelineProject"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getPipelineProject
      tags: [Pipeline]
      summary: Retrieve a project with its stage evidence and linkages
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePipelineProject"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/projects/{projectId}/stage-advancements:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: advanceProjectStage
      tags: [Pipeline]
      summary: Advance a project to the next stage against that stage's evidence
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageAdvancementCreate"
      responses:
        "201":
          description: Advancement approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeStageAdvancement"
        "409":
          description: Refused because required stage evidence is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/portfolio-cohorts:
    get:
      operationId: listPortfolioCohorts
      tags: [Pipeline]
      summary: List portfolio cohorts with target and actual conversion
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
